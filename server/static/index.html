<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>ND Shared Power</title>
	<script>
		const host = window.location.hostname;

		/*
		 * Render exposes the server publicly over HTTPS/WSS on 443.
		 * Send users to Pokémon Showdown's official test client
		 * and explicitly target this Render backend.
		 */
		const target =
			'https://play.pokemonshowdown.com/testclient-new.html?~~' +
			host +
			':443';

		window.location.replace(target);
	</script>
</head>
<body>
	<p>Connecting to ND Shared Power...</p>
</body>
</html>
